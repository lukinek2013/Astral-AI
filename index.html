<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astral AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .chat-container { width: 100%; max-width: 650px; background: #1e293b; border-radius: 12px; display: flex; flex-direction: column; height: 85vh; border: 1px solid #334155; }
        .header { padding: 16px; background: #6366f1; border-top-left-radius: 12px; border-top-right-radius: 12px; font-size: 1.2rem; font-weight: bold; text-align: center; }
        .controls { padding: 12px 16px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; gap: 8px; align-items: center; }
        .controls select { flex: 1; padding: 8px 12px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: white; outline: none; }
        .messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 10px; line-height: 1.4; word-break: break-word; }
        .user { background: #6366f1; align-self: flex-end; }
        .bot { background: #334155; align-self: flex-start; }
        .model-tag { font-size: 0.75rem; color: #94a3b8; margin-bottom: 4px; display: block; }
        .input-area { padding: 16px; display: flex; gap: 8px; border-top: 1px solid #334155; }
        input[type="text"] { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; outline: none; }
        button { padding: 10px 16px; background: #6366f1; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #4f46e5; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">✨ Astral AI</div>
    
    <div class="controls">
        <label for="modelSelect" style="font-size:0.9rem; color:#94a3b8;">Model:</label>
        <select id="modelSelect">
            <option value="openai/gpt-4o-mini">ChatGPT (GPT-4o Mini)</option>
            <option value="meta-llama/llama-3.3-70b-instruct">Groq / Meta (Llama 3.3 70B)</option>
            <option value="anthropic/claude-3.5-haiku">Claude (Claude 3.5 Haiku)</option>
            <option value="openrouter/auto">Model ZDARMA (Automatický)</option>
        </select>
    </div>

    <div class="messages" id="messages">
        <div class="msg bot">
            <span class="model-tag">Astral System</span>
            Ahoj! Já jsem Astral AI. Vyber si model nahoře a zeptej se mě na cokoliv.
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Napiš zprávu..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Odeslat</button>
    </div>
</div>

<script>
    // === SEM VLOŽ SVŮJ API KLÍČ Z OPENROUTERU ===
    const API_KEY = "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";

    async function sendMessage() {
        const model = document.getElementById('modelSelect').value;
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        const messagesDiv = document.getElementById('messages');

        if (!API_KEY || API_KEY === "TVUJ_OPENROUTER_API_KLIC_ZDE") {
            alert('Nejprve vlož do kódu v souboru index.html svůj platný OpenRouter API klíč!');
            return;
        }
        if (!text) return;

        appendMessage(text, 'user');
        input.value = '';

        const selectedModelName = document.getElementById('modelSelect').options[document.getElementById('modelSelect').selectedIndex].text;
        const loadingMsg = appendMessage('Astral AI přemýšlí...', 'bot', selectedModelName);

        try {
            const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    "model": model,
                    "messages": [
                        { "role": "system", "content": "Jsi Astral AI, chytry, moderni a přatelsky virtuální asistent." },
                        { "role": "user", "content": text }
                    ]
                })
            });

            const data = await response.json();
            messagesDiv.removeChild(loadingMsg);

            if (data.choices && data.choices[0].message.content) {
                appendMessage(data.choices[0].message.content, 'bot', selectedModelName);
            } else if (data.error) {
                appendMessage('Chyba API: ' + data.error.message, 'bot', 'Chyba');
            } else {
                appendMessage('Nepodařilo se získat odpověď od modelu.', 'bot', 'Chyba');
            }
        } catch (err) {
            messagesDiv.removeChild(loadingMsg);
            appendMessage('Chyba spojení: ' + err.message, 'bot', 'Chyba');
        }
    }

    function appendMessage(text, type, modelTag = '') {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        
        if (type === 'bot' && modelTag) {
            const tagSpan = document.createElement('span');
            tagSpan.className = 'model-tag';
            tagSpan.innerText = modelTag;
            div.appendChild(tagSpan);
        }

        const textNode = document.createElement('div');
        textNode.innerText = text;
        div.appendChild(textNode);

        const messagesDiv = document.getElementById('messages');
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        return div;
    }
</script>

</body>
</html>
